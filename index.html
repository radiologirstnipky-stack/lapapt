<!DOCTYPE html>
<html lang="id">
<head>
<!-- Chosen Palette: Military Pharmacy Olive & Brass (dengan Mode Gelap Warm Neutral) -->
<!-- Application Structure Plan: Aplikasi web satu halaman (SPA) berfokus pada efisiensi operasional petugas Apotek Rumkit TNI AD. Konfigurasi URL Google Apps Script diletakkan di dalam variabel JavaScript file HTML (const GAS_URL) untuk menjaga kebersihan UI utama. UI terdiri dari Header (jam WIB & tombol Dark Mode), Pemilih Tanggal, Input Petugas Dinas Jaga dengan chip nama tersimpan & status sinkronisasi, Accordion Kategori Pelayanan Pasien dengan stepper, serta Bottom Preview Sheet interaktif. -->
<!-- Visualization & Content Choices: Pengelompokan data menggunakan komponen HTML/CSS responsive, indikator badge status sinkronisasi pada kartu Dinas Jaga, stepper interaktif untuk hitung cepat pasien per kategori, serta bottom sheet untuk pratinjau format teks laporan siap kirim dengan dukungan emoji universal (UTF-8). CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
<!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Serah Terima Jaga Apotek — Rumkit TNI AD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green-950:#131f17;
    --green-900:#1c2e21;
    --green-800:#2c4732;
    --green-700:#3a5c42;
    --brass-600:#a9803f;
    --brass-500:#c1974f;
    --paper:#eef1ec;
    --card:#ffffff;
    --line:#dde3da;
    --text:#1c231e;
    --text-dim:#5c6a5e;
    --radius:10px;
    --input-bg:#fbfbfa;
    --chip-bg:#eef2ea;
    --cat-bg:#fafaf8;
    --cat-open:#f0f3ed;
  }

  /* Mode Gelap (Dark Theme) */
  body.dark-mode {
    --paper:#121814;
    --card:#1c261f;
    --line:#2b3a2e;
    --text:#e1e7e2;
    --text-dim:#8b9e8e;
    --input-bg:#151e17;
    --chip-bg:#243329;
    --cat-bg:#202d24;
    --cat-open:#27372c;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  .head{
    background:linear-gradient(180deg,var(--green-950),var(--green-900) 85%);
    color:#f2f3ee;
    padding:18px 16px 22px;
    border-bottom:3px solid var(--brass-600);
  }
  .head-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .head-eyebrow{
    font-family:'Barlow Semi Condensed',sans-serif;
    font-weight:700;
    font-size:12.5px;
    letter-spacing:.02em;
    color:var(--brass-500);
    margin:0 0 2px;
  }
  .greeting{
    font-family:'Barlow Semi Condensed',sans-serif;
    font-weight:700;
    font-size:26px;
    line-height:1.1;
    margin:0;
  }
  .head-right{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:8px;
  }
  .clock{text-align:right;font-variant-numeric:tabular-nums;}
  .clock-time{font-size:20px;font-weight:600;}
  .clock-zone{font-size:11px;color:#b8c2b8;}
  
  /* Tombol Tema Gelap */
  .theme-toggle-btn {
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #f2f3ee;
    padding: 5px 11px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
  }
  .theme-toggle-btn:hover { background: rgba(255, 255, 255, 0.2); }

  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:14px 12px 0;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:12px;
    transition: background-color 0.3s ease, border-color 0.3s ease;
  }
  .card-title{
    font-family:'Barlow Semi Condensed',sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:.01em;
    color:var(--brass-500);
    margin:0 0 10px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .field{margin-bottom:10px;}
  .field:last-child{margin-bottom:0;}
  label.flabel{
    display:block;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:4px;
    font-weight:500;
  }
  input[type=text],input[type=date],select{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--input-bg);
    font-family:inherit;
    font-size:14.5px;
    color:var(--text);
    transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
  }
  input:focus,select:focus{
    outline:2px solid var(--green-700);
    outline-offset:1px;
  }
  .toggle-line{
    display:flex;align-items:center;gap:8px;
    font-size:13px;color:var(--text-dim);
    margin-bottom:8px;
  }
  .toggle-line input{accent-color:var(--green-700);width:16px;height:16px;}
  .date-preview{
    font-family:'Barlow Semi Condensed',sans-serif;
    font-weight:700;
    font-size:18px;
    color:var(--text);
    background:var(--input-bg);
    border:1px dashed var(--line);
    border-radius:8px;
    padding:8px 10px;
  }

  /* Status Google Sheets */
  .sync-badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 12px;
    font-weight: 600;
    background: #e0e0e0;
    color: #555;
  }
  .sync-badge.online { background: #d1e7dd; color: #0f5132; }
  .sync-badge.syncing { background: #fff3cd; color: #664d03; }
  .sync-badge.error { background: #f8d7da; color: #842029; }

  /* Dinas:dua baris, label kiri / nama kanan */
  .dinas-row{
    display:grid;
    grid-template-columns:96px 1fr;
    gap:10px;
    align-items:start;
    padding:8px 0;
  }
  .dinas-row + .dinas-row{border-top:1px solid var(--line);}
  .dinas-label-select{
    font-family:'Barlow Semi Condensed',sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--text);
    background:var(--input-bg);
    border:1px solid var(--line);
    border-radius:7px;
    padding:6px 5px;
    width:100%;
    cursor:pointer;
  }
  .dinas-label-select:focus{outline:2px solid var(--green-700);outline-offset:1px;}
  .name-input-wrap{position:relative;}
  .added-names{
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-bottom:6px;
  }
  .added-name-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    background:var(--chip-bg);
    border:1px solid var(--line);
    border-radius:7px;
    padding:5px 5px 5px 9px;
    font-size:13px;
    color:var(--text);
  }
  .added-name-row .rm{
    cursor:pointer;
    color:#a13e3e;
    font-weight:700;
    padding:2px 6px;
    line-height:1;
  }
  .name-add-line{
    display:flex;
    gap:6px;
  }
  .name-add-line input{flex:1;}
  .add-name-btn{
    width:38px;
    flex-shrink:0;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--green-800);
    color:#fff;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    line-height:1;
  }
  .add-name-btn:active{background:var(--green-700);}
  .saved-names{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:6px;
  }
  .saved-chip{
    font-size:11.5px;
    padding:4px 9px;
    border-radius:999px;
    background:var(--chip-bg);
    border:1px solid var(--line);
    color:var(--text);
    cursor:pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .saved-chip:hover{border-color:var(--brass-500);}
  .saved-chip .rm-db{
    color:#a13e3e;
    font-weight:700;
    margin-left:3px;
    padding: 0 4px;
    border-radius: 50%;
  }
  .saved-chip .rm-db:hover{
    background:#a13e3e;
    color:#fff;
  }

  /* accordion categories */
  .cat{border:1px solid var(--line);border-radius:8px;margin-bottom:7px;overflow:hidden;}
  .cat:last-child{margin-bottom:0;}
  .cat summary{
    list-style:none;cursor:pointer;padding:10px 11px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--cat-bg);
    color:var(--text);
  }
  .cat summary::-webkit-details-marker{display:none;}
  .cat[open] summary{background:var(--cat-open);border-bottom:1px solid var(--line);}
  .cat-name{display:flex;align-items:baseline;gap:7px;font-size:13.5px;font-weight:600;min-width:0;}
  .cat-code{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;color:var(--brass-600);font-size:14px;}
  .cat-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cat-total{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--chip-bg);color:var(--text-dim);white-space:nowrap;}
  .cat-total.on{background:var(--green-800);color:#fff;}
  .cat-body{padding:9px 11px 11px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .sub-row{
    display:flex;align-items:center;justify-content:space-between;gap:6px;
    background:var(--input-bg);border:1px solid var(--line);border-radius:7px;padding:6px 6px 6px 9px;
  }
  .sub-label{font-size:12px;color:var(--text-dim);line-height:1.2;}
  .stepper{display:flex;align-items:center;gap:5px;}
  .stepper button{
    width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--card);
    color:var(--text);font-size:15px;font-weight:700;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .stepper button:active{background:var(--green-800);color:#fff;}
  .stepper button.minus{color:#a13e3e;}
  .stepper .count{min-width:16px;text-align:center;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;}
  @media (max-width:380px){.cat-body{grid-template-columns:1fr;}}
  .hint{font-size:11px;color:var(--text-dim);}

  /* ===== Bottom preview sheet ===== */
  #previewPanel{
    position:fixed;
    left:0;right:0;bottom:0;
    z-index:999;
    background:var(--card);
    border-top:2px solid var(--brass-600);
    box-shadow:0 -6px 18px rgba(19,31,23,.18);
    display:flex;
    flex-direction:column;
    transition:height .25s ease, background-color 0.3s ease;
    height:54px;
    max-width:640px;
    margin:0 auto;
    border-radius:12px 12px 0 0;
    overflow:hidden;
  }
  #previewPanel.maximized{height:min(78vh,640px);}
  .preview-bar{
    height:54px;
    min-height:54px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    cursor:pointer;
    background:var(--green-900);
    color:#f2f3ee;
  }
  .preview-bar-left{display:flex;align-items:center;gap:8px;}
  .preview-dot{width:7px;height:7px;border-radius:50%;background:#7fdc9a;}
  .preview-bar-title{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:14px;}
  .preview-bar-actions{display:flex;align-items:center;gap:6px;}
  .icon-btn{
    width:30px;height:30px;border-radius:7px;border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08);color:#fff;font-size:15px;font-weight:700;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .icon-btn:active{background:rgba(255,255,255,.22);}
  .preview-body{
    flex:1;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    padding:10px 12px 12px;
    min-height:0;
  }
  #outputText{
    flex:1;
    width:100%;
    resize:none;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px;
    font-family:'Inter','Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;
    font-size:13px;
    line-height:1.5;
    white-space:pre-wrap;
    background:var(--input-bg);
    color:var(--text);
    min-height:0;
  }
  .action-row{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .action-btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:14px 10px;
    border:none;
    border-radius:10px;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    color:#fff;
    font-family:'Inter',sans-serif;
  }
  .btn-icon{font-size:16px;line-height:1;}
  #waBtn{background:#25D366;}
  #waBtn:active{background:#1fb959;}
  #copyBtn{background:var(--brass-600);}
  #copyBtn:active{background:var(--brass-500);}
  .copy-note{text-align:center;font-size:12px;color:var(--text-dim);margin-top:6px;height:14px;}
  #bottomSpacer{height:66px;}
</style>
</head>
<body>

<div class="head">
  <div class="head-top">
    <div>
      <p class="head-eyebrow">RUMKIT TNI AD · APOTEK</p>
      <p class="greeting" id="greetingText">Selamat pagi</p>
    </div>
    <div class="head-right">
      <button type="button" class="theme-toggle-btn" id="themeToggleBtn">
        <span id="themeIcon">🌙</span> <span id="themeText">Gelap</span>
      </button>
      <div class="clock">
        <div class="clock-time" id="clockTime">--:--</div>
        <div class="clock-zone">WIB</div>
      </div>
    </div>
  </div>
</div>

<div class="wrap">

  <!-- TANGGAL -->
  <div class="card">
    <div class="card-title">Tanggal Laporan</div>
    <div class="toggle-line">
      <input type="checkbox" id="manualDateToggle">
      <label for="manualDateToggle">Isi tanggal manual</label>
    </div>
    <div class="field" id="autoDateField">
      <div class="date-preview" id="dateAutoPreview">—</div>
    </div>
    <div class="field" id="manualDateField" style="display:none;">
      <input type="date" id="manualDateInput">
    </div>
  </div>

  <!-- DINAS -->
  <div class="card">
    <div class="card-title">
      <span>Dinas Jaga</span>
      <span class="sync-badge" id="syncStatus">Lokal</span>
    </div>
    <div class="hint" style="margin-bottom:8px;">Terisi otomatis sesuai jam WIB saat ini — pilih manual kapan saja jika perlu.</div>

    <div class="dinas-row">
      <select class="dinas-label-select" id="shiftSelect1">
        <option value="pagi">Dinas Pagi</option>
        <option value="siang">Dinas Siang</option>
        <option value="malam">Dinas Malam</option>
      </select>
      <div class="name-input-wrap">
        <div class="added-names" id="addedNames1"></div>
        <div class="name-add-line">
          <input type="text" id="nameInput1" placeholder="Ketik nama, lalu Enter">
          <button type="button" class="add-name-btn" data-row="1" aria-label="Tambah nama">+</button>
        </div>
        <div class="saved-names" id="savedNames1"></div>
      </div>
    </div>

    <div class="dinas-row">
      <select class="dinas-label-select" id="shiftSelect2">
        <option value="pagi">Dinas Pagi</option>
        <option value="siang">Dinas Siang</option>
        <option value="malam" selected>Dinas Malam</option>
      </select>
      <div class="name-input-wrap">
        <div class="added-names" id="addedNames2"></div>
        <div class="name-add-line">
          <input type="text" id="nameInput2" placeholder="Ketik nama, lalu Enter">
          <button type="button" class="add-name-btn" data-row="2" aria-label="Tambah nama">+</button>
        </div>
        <div class="saved-names" id="savedNames2"></div>
      </div>
    </div>
  </div>

  <!-- KETERANGAN -->
  <div class="card">
    <div class="card-title">
      <span>Keterangan Pelayanan</span>
      <span class="hint" id="grandTotalHint">0 pasien</span>
    </div>
    <div id="categoryList"></div>
  </div>

</div>

<div id="bottomSpacer"></div>

<!-- BOTTOM PREVIEW SHEET -->
<div id="previewPanel">
  <div class="preview-bar" id="previewBar">
    <div class="preview-bar-left">
      <span class="preview-dot"></span>
      <span class="preview-bar-title">Preview Laporan</span>
    </div>
    <div class="preview-bar-actions">
      <button type="button" class="icon-btn" id="toggleBtn" title="Maximize">▲</button>
    </div>
  </div>
  <div class="preview-body">
    <textarea id="outputText" readonly></textarea>
    <div class="action-row">
      <button type="button" class="action-btn" id="waBtn">
        <span class="btn-icon">💬</span>
        <span>Kirim ke WhatsApp</span>
      </button>
      <button type="button" class="action-btn" id="copyBtn">
        <span class="btn-icon" id="copyBtnIcon">⧉</span>
        <span id="copyBtnLabel">Salin Teks</span>
      </button>
    </div>
    <div class="copy-note" id="copyNote"></div>
  </div>
</div>

<script>
// =========================================================================
// KONFIGURASI GOOGLE APPS SCRIPT WEB APP URL
// Tempelkan URL Web App Google Apps Script Anda di antara tanda kutip di bawah:
// Contoh: const GAS_URL = "https://script.google.com/macros/s/AKfycb.../exec";
// =========================================================================
const GAS_URL = "https://script.google.com/macros/s/AKfycbwDoXb0WYIfdWB2yKxJwet_HPBt3Weh-jtgCHLm6AIui0UKHPx5fRv850nZFLifzCk/exec"; 


// ---------- DARK THEME TOGGLE ----------
const themeToggleBtn = document.getElementById('themeToggleBtn');
const themeIcon = document.getElementById('themeIcon');
const themeText = document.getElementById('themeText');

function initTheme() {
  const isDark = localStorage.getItem('theme') === 'dark';
  if (isDark) {
    document.body.classList.add('dark-mode');
    themeIcon.textContent = '☀️';
    themeText.textContent = 'Terang';
  } else {
    document.body.classList.remove('dark-mode');
    themeIcon.textContent = '🌙';
    themeText.textContent = 'Gelap';
  }
}

themeToggleBtn.addEventListener('click', () => {
  const isDark = document.body.classList.toggle('dark-mode');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  themeIcon.textContent = isDark ? '☀️' : '🌙';
  themeText.textContent = isDark ? 'Terang' : 'Gelap';
});

initTheme();

// ---------- Category data ----------
const ALL_SUBS = ['Militer','PNS','KBT','Masy. Umum','Purnawirawan'];
const CATEGORIES = [
  {code:'A', title:'Pasien Poli Dalam',      subs:ALL_SUBS,            hasKet:true},
  {code:'B', title:'Pasien Poli Gigi',       subs:ALL_SUBS,            hasKet:true},
  {code:'C', title:'Rajal UGD',              subs:ALL_SUBS,            hasKet:true},
  {code:'D', title:'Ranap UGD',              subs:ALL_SUBS,            hasKet:true},
  {code:'E', title:'Poli Obgyn',             subs:ALL_SUBS,            hasKet:false},
  {code:'F', title:'Poli Bedah',             subs:ALL_SUBS,            hasKet:false},
  {code:'G', title:'Poli Anak',              subs:ALL_SUBS.slice(0,4), hasKet:false},
  {code:'H', title:'Poli Saraf',             subs:ALL_SUBS,            hasKet:false},
  {code:'I', title:'Poli Ortopedi',          subs:ALL_SUBS,            hasKet:false},
  {code:'J', title:'Poli Jiwa/Psikiatri',    subs:ALL_SUBS,            hasKet:false},
  {code:'K', title:'Poli Paru',              subs:ALL_SUBS,            hasKet:false},
  {code:'L', title:'Poli Kulit & Kelamin',   subs:ALL_SUBS,            hasKet:false},
];

const state = {};
CATEGORIES.forEach(c=>{
  state[c.code] = {};
  c.subs.forEach(s=> state[c.code][s]=0);
});

// ---------- Render category accordion ----------
const listEl = document.getElementById('categoryList');
CATEGORIES.forEach(c=>{
  const det = document.createElement('details');
  det.className='cat';
  det.dataset.code = c.code;

  const summary = document.createElement('summary');
  summary.innerHTML = `
    <span class="cat-name">
      <span class="cat-code">${c.code}.</span>
      <span class="cat-title">${c.title}</span>
    </span>
    <span class="cat-total" id="total-${c.code}">nihil</span>
  `;
  det.appendChild(summary);

  const body = document.createElement('div');
  body.className='cat-body';
  c.subs.forEach(sub=>{
    const row = document.createElement('div');
    row.className='sub-row';
    row.innerHTML = `
      <span class="sub-label">${sub}</span>
      <span class="stepper">
        <button type="button" class="minus" data-code="${c.code}" data-sub="${sub}" aria-label="Kurangi ${sub}">−</button>
        <span class="count" id="count-${c.code}-${sub.replace(/\W/g,'')}">0</span>
        <button type="button" class="plus" data-code="${c.code}" data-sub="${sub}" aria-label="Tambah ${sub}">+</button>
      </span>
    `;
    body.appendChild(row);
  });
  det.appendChild(body);
  listEl.appendChild(det);
});

function subId(code,sub){ return `count-${code}-${sub.replace(/\W/g,'')}`; }

function updateCategory(code){
  const cat = CATEGORIES.find(c=>c.code===code);
  const total = cat.subs.reduce((sum,s)=> sum + state[code][s], 0);
  const totalEl = document.getElementById('total-'+code);
  if(total>0){ totalEl.textContent = total+' orang'; totalEl.classList.add('on'); }
  else { totalEl.textContent = 'nihil'; totalEl.classList.remove('on'); }
  updateGrandTotal();
  refreshPreview();
}

function updateGrandTotal(){
  let grand=0;
  CATEGORIES.forEach(c=> c.subs.forEach(s=> grand += state[c.code][s]));
  document.getElementById('grandTotalHint').textContent = grand+' pasien';
}

listEl.addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  const code = btn.dataset.code;
  const sub = btn.dataset.sub;
  if(!code || !sub) return;
  if(btn.classList.contains('plus')) state[code][sub]++;
  else if(btn.classList.contains('minus')) state[code][sub] = Math.max(0, state[code][sub]-1);
  document.getElementById(subId(code,sub)).textContent = state[code][sub];
  updateCategory(code);
});

// ---------- Clock / greeting (WIB realtime) ----------
const DAY_NAMES = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

function getWIBParts(){
  const now = new Date();
  const fmt = new Intl.DateTimeFormat('en-CA', {
    timeZone:'Asia/Jakarta', hour12:false,
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit'
  });
  const parts = fmt.formatToParts(now);
  const map = {};
  parts.forEach(p=> map[p.type]=p.value);
  return { year:+map.year, month:+map.month, day:+map.day, hour:+map.hour, minute:+map.minute, second:+map.second };
}

function greetingForHour(h){
  if(h>=4 && h<11) return 'Selamat pagi';
  if(h>=11 && h<15) return 'Selamat siang';
  if(h>=15 && h<18) return 'Selamat sore';
  return 'Selamat malam';
}

function dayNameFromDate(y,m,d){
  const dt = new Date(Date.UTC(y, m-1, d));
  return DAY_NAMES[dt.getUTCDay()];
}
function pad2(n){ return n.toString().padStart(2,'0'); }

function tickClock(){
  const wib = getWIBParts();
  document.getElementById('clockTime').textContent = `${pad2(wib.hour)}:${pad2(wib.minute)}:${pad2(wib.second)}`;
  document.getElementById('greetingText').textContent = greetingForHour(wib.hour);

  if(!document.getElementById('manualDateToggle').checked){
    const dname = dayNameFromDate(wib.year, wib.month, wib.day);
    document.getElementById('dateAutoPreview').textContent = `${dname}, ${pad2(wib.day)}/${pad2(wib.month)}/${wib.year}`;
  }
  applyAutoShift();
  refreshPreview();
}

// ---------- Manual date toggle ----------
const manualToggle = document.getElementById('manualDateToggle');
const autoDateField = document.getElementById('autoDateField');
const manualDateField = document.getElementById('manualDateField');
const manualDateInput = document.getElementById('manualDateInput');

manualToggle.addEventListener('change', ()=>{
  if(manualToggle.checked){
    autoDateField.style.display='none';
    manualDateField.style.display='block';
    if(!manualDateInput.value){
      const wib = getWIBParts();
      manualDateInput.value = `${wib.year}-${pad2(wib.month)}-${pad2(wib.day)}`;
    }
  } else {
    autoDateField.style.display='block';
    manualDateField.style.display='none';
  }
  refreshPreview();
});
manualDateInput.addEventListener('input', refreshPreview);

function getReportDateString(){
  if(manualToggle.checked && manualDateInput.value){
    const [y,m,d] = manualDateInput.value.split('-').map(Number);
    return `${dayNameFromDate(y,m,d)}, ${pad2(d)}/${pad2(m)}/${y}`;
  }
  return document.getElementById('dateAutoPreview').textContent;
}

// ---------- GOOGLE APPS SCRIPT INTEGRATION ----------
const syncStatus = document.getElementById('syncStatus');
const STORAGE_KEY = 'dinas-nama-tersimpan';
let savedNamesCache = [];

function setSyncStatus(status, type = '') {
  syncStatus.textContent = status;
  syncStatus.className = 'sync-badge ' + type;
}

async function loadSavedNames(){
  if (GAS_URL && GAS_URL.trim() !== '') {
    setSyncStatus('Sinkron...', 'syncing');
    try {
      const res = await fetch(`${GAS_URL}?action=get`);
      const data = await res.json();
      if (data.success && Array.isArray(data.names)) {
        savedNamesCache = data.names;
        setSyncStatus('Google Sheets', 'online');
      } else {
        throw new Error('Format respon tidak valid');
      }
    } catch (err) {
      console.warn('Gagal ambil dari Apps Script, menggunakan penyimpanan lokal:', err);
      setSyncStatus('Gagal Sync (Lokal)', 'error');
      loadFromLocalStorage();
    }
  } else {
    setSyncStatus('Lokal', '');
    loadFromLocalStorage();
  }
  renderSavedNames(1);
  renderSavedNames(2);
}

function loadFromLocalStorage() {
  const local = localStorage.getItem(STORAGE_KEY);
  savedNamesCache = local ? JSON.parse(local) : [];
}

function saveToLocalStorage() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(savedNamesCache));
}

async function saveNameIfNew(name){
  name = name.trim();
  if(!name) return;
  if(savedNamesCache.includes(name)) return;
  
  savedNamesCache = [name, ...savedNamesCache];
  saveToLocalStorage();
  renderSavedNames(1);
  renderSavedNames(2);

  if (GAS_URL && GAS_URL.trim() !== '') {
    setSyncStatus('Menyimpan...', 'syncing');
    try {
      const res = await fetch(`${GAS_URL}?action=add&name=${encodeURIComponent(name)}`);
      const data = await res.json();
      if (data.success) {
        setSyncStatus('Google Sheets', 'online');
      }
    } catch (err) {
      console.error('Gagal simpan ke Apps Script:', err);
      setSyncStatus('Gagal Simpan', 'error');
    }
  }
}

async function removeName(name){
  savedNamesCache = savedNamesCache.filter(n => n !== name);
  saveToLocalStorage();
  renderSavedNames(1);
  renderSavedNames(2);

  if (GAS_URL && GAS_URL.trim() !== '') {
    setSyncStatus('Menghapus...', 'syncing');
    try {
      const res = await fetch(`${GAS_URL}?action=delete&name=${encodeURIComponent(name)}`);
      const data = await res.json();
      if (data.success) {
        setSyncStatus('Google Sheets', 'online');
      }
    } catch (err) {
      console.error('Gagal hapus dari Apps Script:', err);
      setSyncStatus('Gagal Hapus', 'error');
    }
  }
}

// Daftar nama yang sudah ditambahkan ke masing-masing baris dinas
const namesByRow = { 1:[], 2:[] };

const SHIFT_ORDER = ['pagi','siang','malam'];
const manualOverride = { 1:false, 2:false };

function getCurrentShiftByHour(h){
  if(h>=7 && h<14) return 'pagi';
  if(h>=14 && h<21) return 'siang';
  return 'malam';
}
function getPrevShift(shift){
  const idx = SHIFT_ORDER.indexOf(shift);
  return SHIFT_ORDER[(idx+2)%3];
}

function applyAutoShift(){
  const wib = getWIBParts();
  const current = getCurrentShiftByHour(wib.hour);
  const previous = getPrevShift(current);
  let changed = false;
  if(!manualOverride[1] && slotEls[1].select.value !== previous){
    slotEls[1].select.value = previous;
    slotEls[1].select.dataset.prev = previous;
    changed = true;
  }
  if(!manualOverride[2] && slotEls[2].select.value !== current){
    slotEls[2].select.value = current;
    slotEls[2].select.dataset.prev = current;
    changed = true;
  }
  if(changed){
    renderSavedNames(1);
    renderSavedNames(2);
  }
}

const slotEls = {
  1:{ select:document.getElementById('shiftSelect1'), input:document.getElementById('nameInput1'), holder:document.getElementById('savedNames1'), addedHolder:document.getElementById('addedNames1') },
  2:{ select:document.getElementById('shiftSelect2'), input:document.getElementById('nameInput2'), holder:document.getElementById('savedNames2'), addedHolder:document.getElementById('addedNames2') },
};

function renderSavedNames(rowNum){
  const { holder } = slotEls[rowNum];
  holder.innerHTML='';
  savedNamesCache.forEach(name=>{
    const chip = document.createElement('span');
    chip.className='saved-chip';
    chip.innerHTML = `<span>${name}</span><span class="rm-db" title="Hapus Permanen dari Database">&times;</span>`;
    
    chip.addEventListener('click', (e)=>{
      if(e.target.classList.contains('rm-db')){
        e.stopPropagation();
        if(confirm(`Hapus "${name}" secara permanen dari database Google Sheets?`)) {
          removeName(name);
        }
        return;
      }
      addName(rowNum, name);
    });
    holder.appendChild(chip);
  });
}

function renderAddedNames(rowNum){
  const { addedHolder } = slotEls[rowNum];
  addedHolder.innerHTML = '';
  namesByRow[rowNum].forEach((name, idx)=>{
    const row = document.createElement('div');
    row.className = 'added-name-row';
    row.innerHTML = `<span>${name}</span><span class="rm" data-row="${rowNum}" data-idx="${idx}" aria-label="Hapus ${name}">&times;</span>`;
    addedHolder.appendChild(row);
  });
}

function addName(rowNum, name){
  name = (name||'').trim();
  if(!name) return;
  namesByRow[rowNum].push(name);
  renderAddedNames(rowNum);
  saveNameIfNew(name);
  refreshPreview();
}

function removeAddedName(rowNum, idx){
  namesByRow[rowNum].splice(idx,1);
  renderAddedNames(rowNum);
  refreshPreview();
}

document.addEventListener('click', (e)=>{
  const rm = e.target.closest('.added-name-row .rm');
  if(rm){
    removeAddedName(Number(rm.dataset.row), Number(rm.dataset.idx));
  }
});

function handleShiftChange(rowNum){
  const otherRow = rowNum===1 ? 2 : 1;
  const changed = slotEls[rowNum];
  const other = slotEls[otherRow];
  const newVal = changed.select.value;
  manualOverride[rowNum] = true;
  if(other.select.value === newVal){
    other.select.value = changed.select.dataset.prev || (newVal==='pagi' ? 'malam' : 'pagi');
    manualOverride[otherRow] = true;
    renderSavedNames(otherRow);
  }
  changed.select.dataset.prev = newVal;
  renderSavedNames(rowNum);
  refreshPreview();
}

slotEls[1].select.dataset.prev = slotEls[1].select.value;
slotEls[2].select.dataset.prev = slotEls[2].select.value;
slotEls[1].select.addEventListener('change', ()=> handleShiftChange(1));
slotEls[2].select.addEventListener('change', ()=> handleShiftChange(2));

[1,2].forEach(rowNum=>{
  const { input } = slotEls[rowNum];
  input.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){
      e.preventDefault();
      addName(rowNum, input.value);
      input.value='';
    }
  });
});

document.querySelectorAll('.add-name-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const rowNum = Number(btn.dataset.row);
    const input = slotEls[rowNum].input;
    addName(rowNum, input.value);
    input.value='';
    input.focus();
  });
});

loadSavedNames();

// ---------- Build report text (live) ----------
const SHIFT_WORD = { pagi:'pagi', siang:'siang', malam:'malam' };
function fmtVal(n){ return n>0 ? `${n} orang` : 'nihil'; }

function buildReport(){
  const greeting = document.getElementById('greetingText').textContent;
  const tanggal = getReportDateString();

  let lines = [];
  lines.push(greeting);
  lines.push('Ijin melaporkan serah terima Jaga Apotek Rumkit TNI AD');
  lines.push(`*${tanggal}* sebagai berikut:`);
  lines.push('');
  [1,2].forEach(rowNum=>{
    const { select } = slotEls[rowNum];
    const names = namesByRow[rowNum];
    lines.push(`*Dinas ${SHIFT_WORD[select.value]}*`);
    if(names.length){
      names.forEach(n=> lines.push(n));
    } else {
      lines.push('-');
    }
    lines.push('');
  });
  lines.push('');
  lines.push('Keterangan :');

  CATEGORIES.forEach(c=>{
    const total = c.subs.reduce((s,k)=> s + state[c.code][s], 0);
    lines.push(`${c.code}. ${c.title} : ${fmtVal(total)}`);
    if(c.hasKet) lines.push('Ket :');
    c.subs.forEach((sub,i)=>{
      lines.push(`${i+1}. ${sub} : ${fmtVal(state[c.code][sub])}`);
    });
    lines.push('');
  });

  lines.push('Rumkit TNI-AD dalam keadaan aman,');
  
  // Menggunakan Emoji UTF-8 Standar (Universal: PC, Android, iPhone, WhatsApp)
  lines.push('Laporan Selesai ' + String.fromCodePoint(0x1F64F));

  return lines.join('\n').replace(/\n{3,}/g,'\n\n');
}

function refreshPreview(){
  const ta = document.getElementById('outputText');
  ta.value = buildReport();
}

// ---------- Bottom sheet minimize/maximize ----------
const panel = document.getElementById('previewPanel');
const previewBar = document.getElementById('previewBar');
const toggleBtn = document.getElementById('toggleBtn');

function setPanelState(maximized){
  panel.classList.toggle('maximized', maximized);
  toggleBtn.textContent = maximized ? '▼' : '▲';
  toggleBtn.title = maximized ? 'Minimize' : 'Maximize';
}
previewBar.addEventListener('click', ()=> setPanelState(!panel.classList.contains('maximized')));

// ---------- Copy ----------
const copyBtnLabel = document.getElementById('copyBtnLabel');
const copyBtnIcon = document.getElementById('copyBtnIcon');
document.getElementById('copyBtn').addEventListener('click', async (e)=>{
  e.stopPropagation();
  const ta = document.getElementById('outputText');
  const note = document.getElementById('copyNote');
  try{
    await navigator.clipboard.writeText(ta.value);
    note.textContent = 'Teks berhasil disalin.';
  }catch(err){
    ta.select();
    document.execCommand('copy');
    note.textContent = 'Teks berhasil disalin.';
  }
  copyBtnIcon.textContent = '✓';
  copyBtnLabel.textContent = 'Tersalin!';
  setTimeout(()=>{
    copyBtnIcon.textContent = '⧉';
    copyBtnLabel.textContent = 'Salin Teks';
    note.textContent='';
  }, 2200);
});

// ---------- Kirim ke WhatsApp ----------
document.getElementById('waBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  const btn = e.currentTarget;
  const span = btn.querySelector('span:last-child');
  const original = span.textContent;
  const text = document.getElementById('outputText').value;
  const safeText = text.normalize('NFC');
  const url = 'https://wa.me/?text=' + encodeURIComponent(safeText);
  window.open(url, '_blank');
  span.textContent = 'Membuka WhatsApp…';
  setTimeout(()=> span.textContent = original, 1800);
});

// ---------- Init ----------
refreshPreview();
tickClock();
setInterval(tickClock, 1000);
